org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# The project (D:) and the pub cache (C:) are on different drives on Windows: the Kotlin
# incremental cache then fails with "different roots" on every build. Plain compilation works.
kotlin.incremental=false
